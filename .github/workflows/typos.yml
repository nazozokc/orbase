name: Typos

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # flake.nix の pkgs.typos と同じバージョンに合わせて更新する
      - name: Check spelling
        uses: crate-ci/typos@v1.47.2
